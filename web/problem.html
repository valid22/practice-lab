<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Practice Lab · Coding workspace</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Practice Lab home">
      <span class="brand-mark" aria-hidden="true">⌘</span>
      <span>Practice Lab</span>
    </a>
    <span class="top-divider"></span>
    <a class="back-link" id="back-to-problems" href="/">← Problems</a>
    <span class="local"><i></i> Local workspace</span>
  </header>

  <main class="workspace">
    <section class="panel statement-panel" aria-labelledby="problem-title">
      <div class="panel-bar"><span class="bar-icon" aria-hidden="true">▤</span> Problem statement</div>
      <article class="statement">
        <div class="problem-labels" id="problem-labels"></div>
        <h1 id="problem-title">Loading workspace…</h1>
        <div class="topics" id="topics"></div>
        <div id="statement"></div>
        <section id="examples" class="examples" aria-label="Examples"></section>
        <aside id="source-note" class="source-note" hidden>
          <span aria-hidden="true">↗</span>
          <div><strong id="source-heading"></strong>
            <p id="source-description"></p>
            <ul id="source-links"></ul>
          </div>
        </aside>
      </article>
    </section>

    <section class="workbench" aria-label="Coding workbench">
      <section class="panel editor-panel" aria-label="Python editor">
        <div class="panel-bar editor-bar">
          <span class="bar-icon" aria-hidden="true">‹/›</span><span>Python editor</span>
          <button id="reset" class="text-button push" type="button">Reset code</button>
        </div>
        <div class="editor-file"><span class="file-icon" aria-hidden="true">Py</span> solution.py</div>
        <div class="editor-field">
          <pre class="line-gutter" id="line-gutter" aria-hidden="true"></pre>
          <div class="code-field">
            <pre class="highlight" id="highlight" aria-hidden="true"></pre>
            <textarea id="code" aria-label="Python code" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"></textarea>
          </div>
        </div>
        <div class="editor-footer">
          <span id="draft-status" role="status">Draft autosaves</span>
          <span id="position">Ln 1, Col 1</span>
        </div>
      </section>

      <section class="panel tests-panel" aria-label="Tests and attempts">
        <div class="panel-bar tabbar" role="tablist" aria-label="Workbench views">
          <button id="tab-samples" role="tab" aria-controls="test-content" data-tab="samples">Public <span id="sample-count"></span></button>
          <button id="tab-hidden" role="tab" aria-controls="test-content" data-tab="hidden">Hidden</button>
          <button id="tab-custom" role="tab" aria-controls="test-content" data-tab="custom">Custom</button>
          <button id="tab-results" role="tab" aria-controls="test-content" data-tab="results">Results</button>
          <button id="tab-history" role="tab" aria-controls="test-content" data-tab="history">Attempts</button>
        </div>
        <div id="test-content" class="test-content" role="tabpanel" tabindex="0"></div>
        <footer class="actions">
          <button id="save" class="button" type="button">Save attempt</button>
          <div class="run-actions">
            <label class="sr-only" for="run-scope">Tests to run</label>
            <select id="run-scope">
              <option value="samples">Public</option>
              <option value="custom">Custom</option>
              <option value="all">Public + custom</option>
            </select>
            <button id="run" class="button" type="button" title="Run tests (⌘/Ctrl + Enter)" aria-keyshortcuts="Meta+Enter Control+Enter"><span aria-hidden="true">▶</span> Run</button>
            <button id="submit" class="button primary" type="button">Submit</button>
          </div>
        </footer>
      </section>
    </section>
  </main>

  <div id="notice" class="notice" role="status" hidden></div>
</body>
</html>
