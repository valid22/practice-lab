<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Problems · Practice Lab</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/catalog.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Practice Lab home">
      <span class="brand-mark" aria-hidden="true">⌘</span>
      <span>Practice Lab</span>
    </a>
    <span class="top-divider"></span>
    <span class="top-context">Interview practice</span>
    <span class="local"><i></i> Local workspace</span>
  </header>
  <main class="catalog" aria-labelledby="catalog-title">
    <div class="catalog-heading">
      <h1 id="catalog-title">Problems</h1>
      <p class="catalog-progress" id="catalog-progress" hidden></p>
    </div>
    <section class="panel catalog-panel" aria-label="Problem catalog">
      <form id="catalog-filters" class="catalog-filters" autocomplete="off">
        <label class="search-filter">Search <input type="search" id="search" name="q" placeholder="Title, topic, or company"></label>
        <label>Company <select id="company" name="company"><option value="">All companies</option></select></label>
        <label>Difficulty <select id="difficulty" name="difficulty"><option value="">All difficulties</option></select></label>
        <label>Topic <select id="topic" name="topic"><option value="">All topics</option></select></label>
        <label>Status <select id="status" name="status">
          <option value="">All statuses</option><option value="open">To do</option><option value="done">Completed</option>
        </select></label>
        <label>Sort by <select id="sort" name="sort">
          <option value="">Catalog order</option><option value="title">Title A–Z</option>
          <option value="easy">Difficulty ↑</option><option value="hard">Difficulty ↓</option>
          <option value="done">Completed first</option>
        </select></label>
      </form>
      <div class="catalog-summary">
        <p id="catalog-count" role="status">Loading problems…</p>
        <button class="text-button" id="clear-filters" type="button" hidden>Clear filters</button>
      </div>
      <div class="catalog-table-wrap" id="catalog-results" hidden>
        <table class="catalog-table">
          <thead><tr><th scope="col">Problem</th><th scope="col">Company</th><th scope="col">Difficulty</th><th scope="col">Topics</th><th scope="col">Status</th></tr></thead>
          <tbody id="catalog-rows"></tbody>
        </table>
      </div>
      <p class="catalog-empty" id="catalog-empty" hidden></p>
    </section>
  </main>
</body>
</html>
